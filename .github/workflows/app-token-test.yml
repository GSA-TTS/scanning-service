name: GitHub App Token Scope Self-Test

on:
  pull_request:
    paths:
      - ".github/actions/repo-list/**"
      - ".github/repos.txt"
      - ".github/workflows/**"
      - "test/test_app_token_scope.py"
  push:
    branches: [main]
    paths:
      - ".github/actions/repo-list/**"
      - ".github/repos.txt"
      - ".github/workflows/**"
      - "test/test_app_token_scope.py"

permissions:
  contents: read

jobs:
  test:
    name: Validate App token repository scope and permissions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Test token profiles and scope validation
        run: python3 -m unittest discover -s test -p 'test_app_token_scope.py' -v
