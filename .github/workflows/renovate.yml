name: Renovate repos

on:
  schedule:
    - cron: "0 10 * * 1-5" # 10:00 UTC weekdays
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (lookup only, no PRs)"
        type: boolean
        default: false

# Prevent concurrent Renovate runs
concurrency:
  group: renovate
  cancel-in-progress: false

permissions: {}

jobs:
  renovate:
    name: Run Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }} # zizmor: ignore[secrets-outside-env]
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }} # zizmor: ignore[secrets-outside-env]
          owner: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Build repo filter
        id: repos
        run: |
          # Convert repos.txt lines to a JSON array for Renovate's autodiscoverFilter
          FILTER=$(jq -Rc '[inputs | select(. != "")]' .github/repos.txt)
          echo "filter=${FILTER}" >> "$GITHUB_OUTPUT"

      - name: Run Renovate
        uses: renovatebot/github-action@1c0cf989c02653fba0efe7ca5772338860ca71dc # v46.3.12
        env:
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token }}
          RENOVATE_AUTODISCOVER_FILTER: ${{ steps.repos.outputs.filter }}
          RENOVATE_DRY_RUN: ${{ inputs.dry_run == true && 'lookup' || 'null' }}
          LOG_LEVEL: info
        with:
          configurationFile: .github/renovate-global.json5
          token: ${{ steps.app-token.outputs.token }}
