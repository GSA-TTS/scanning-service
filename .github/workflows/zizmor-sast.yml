name: "GitHub Actions Security Analysis"

on:
  schedule:
    - cron: "0 12 * * 3" # Wednesday 12:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report findings without creating PRs/issues"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: zizmor-sast-reports
  cancel-in-progress: false

jobs:
  sast-scan:
    name: Scan org repos for Actions security issues
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo list action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/install-zizmor
            .github/actions/repo-list
            .github/actions/signed-commit
            .github/scripts/zizmor_issue.py
            .github/repos.txt

      - name: Load repository list
        id: repo-list
        uses: $/.github/actions/repo-list

      - name: Install zizmor
        uses: $/.github/actions/install-zizmor

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }} # zizmor: ignore[secrets-outside-env]
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }} # zizmor: ignore[secrets-outside-env]
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.repo-list.outputs.token-repositories }}
          permission-contents: write
          permission-workflows: write
          permission-pull-requests: write
          permission-issues: write

      - name: Scan repos
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: ${{ github.repository_owner }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          ZIZMOR_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NO_COLOR: "1"
          STEPS_REPO_LIST_OUTPUTS_REPOS: ${{ steps.repo-list.outputs.repos }}
          SCAN_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          TODAY=$(date -u +%Y-%m-%d)
          ZIZMOR_VERSION=$(zizmor --version)
          PR_PREFIX="fix: zizmor auto-fix Actions security findings"

          # Create a zizmor config that skips unpinned-uses (Renovate handles that)
          printf 'rules:\n  unpinned-uses:\n    disable: true\n' > /tmp/zizmor.yml

          # Repo list is single-sourced from .github/repos.txt
          REPOS="${STEPS_REPO_LIST_OUTPUTS_REPOS}"

          SCANNED=0
          CLEAN=0
          FINDINGS=0
          FIXED=0
          REPORTED=0

          {
            echo "# zizmor SAST Report — $TODAY"
            echo ""
          } > "$GITHUB_WORKSPACE/sast-report.md"

          for repo in $REPOS; do
            SHORT_NAME=$(echo "$repo" | cut -d'/' -f2)

            # Only scan repos that have opted in (merged the onboarding PR)
            if ! gh api "/repos/${repo}/contents/renovate.json" > /dev/null 2>&1 && \
               ! gh api "/repos/${repo}/contents/renovate.json5" > /dev/null 2>&1 && \
               ! gh api "/repos/${repo}/contents/.renovaterc" > /dev/null 2>&1 && \
               ! gh api "/repos/${repo}/contents/.renovaterc.json" > /dev/null 2>&1; then
              continue
            fi

            # Check if repo has workflow files
            WORKFLOW_COUNT=$(gh api "/repos/${repo}/contents/.github/workflows" \
              --jq 'length' 2>/dev/null || echo "0")

            if [ "$WORKFLOW_COUNT" = "0" ]; then
              continue
            fi

            SCANNED=$((SCANNED + 1))
            WORKDIR=$(mktemp -d)

            # Clone the repo (shallow)
            gh repo clone "$repo" "$WORKDIR" -- --depth 1 --quiet 2>/dev/null || {
              echo "::warning::Failed to clone ${repo}, skipping"
              rm -rf "$WORKDIR"
              continue
            }

            # Run zizmor in report mode first (no fixes)
            SCAN_STATUS=0
            zizmor --no-exit-codes --config /tmp/zizmor.yml --format json \
              "$WORKDIR/.github/workflows/" > "$WORKDIR/zizmor-findings.json" || SCAN_STATUS=$?
            if [ "$SCAN_STATUS" -ne 0 ]; then
              echo "::error::zizmor audit failed for ${repo}; preserving its previous issue report"
              exit 1
            fi
            REPORT_OUTPUT=$(jq -r '[.[] | select(.ignored == false)] | length' "$WORKDIR/zizmor-findings.json")
            if [ "$DRY_RUN" != "true" ]; then
              python3 "$GITHUB_WORKSPACE/.github/scripts/zizmor_issue.py" \
                "$WORKDIR/zizmor-findings.json" "$WORKDIR" "$repo" \
                "$(git -C "$WORKDIR" rev-parse HEAD)" "$ZIZMOR_VERSION" "$SCAN_RUN_URL"
            fi

            if [ "$REPORT_OUTPUT" = "0" ]; then
              CLEAN=$((CLEAN + 1))
              rm -rf "$WORKDIR"
              continue
            fi

            FINDINGS=$((FINDINGS + 1))

            if [ "$DRY_RUN" = "true" ]; then
              {
                echo "### ${SHORT_NAME}"
                echo '```'
                echo "$REPORT_OUTPUT"
                jq -r '.[] | select(.ignored == false) | "\(.determinations.severity): \(.ident)"' \
                  "$WORKDIR/zizmor-findings.json"
                echo '```'
                echo ""
              } >> "$GITHUB_WORKSPACE/sast-report.md"
              rm -rf "$WORKDIR"
              continue
            fi

            # Apply only zizmor's safe fixes. Unsafe findings, including
            # self-repository rewrites, remain in the generated PR for review.
            zizmor --config /tmp/zizmor.yml --fix=safe \
              "$WORKDIR/.github/workflows/" || true

            cd "$WORKDIR"

            if git diff --quiet; then
              # Successful audits already refreshed the canonical issue above.
              REPORTED=$((REPORTED + 1))
            else
              # Auto-fixable changes found — open a PR
              BRANCH="zizmor/sast-fixes-${TODAY}"

              # Check for existing open PR
              EXISTING_PR=$(gh pr list --repo "$repo" --state open \
                --search "in:title \"${PR_PREFIX}\"" --json number \
                --jq '.[0].number' 2>/dev/null || true)

              if [ -n "$EXISTING_PR" ]; then
                echo "Existing PR #${EXISTING_PR} in ${repo}, skipping"
                FIXED=$((FIXED + 1))
                cd /
                rm -rf "$WORKDIR"
                continue
              fi

              # Check for remaining unfixable findings
              REMAINING=$(zizmor --config /tmp/zizmor.yml --format plain \
                "$WORKDIR/.github/workflows/" 2>&1 || true)

              DIFF_STAT=$(git diff --stat)
              REMAINING_SECTION=""
              if [ -n "$REMAINING" ] && ! echo "$REMAINING" | grep -q "No findings"; then
                REMAINING_SECTION="### Remaining findings (need manual review)

          <details>
          <summary>Details</summary>

          \`\`\`
          ${REMAINING}
          \`\`\`

          </details>"
              fi

              PR_BODY="zizmor found security issues in this repo's GitHub Actions workflows and applied safe auto-fixes.

          ### What was fixed

          \`\`\`
          ${DIFF_STAT}
          \`\`\`

          ${REMAINING_SECTION}

          Unsafe fixes are not applied automatically. Review the remaining findings before making any manual changes.

          See [zizmor's audit documentation](https://docs.zizmor.sh/audits/) for details on each finding type.

          ---
          *Generated by the [zizmor SAST workflow](https://github.com/${ORG}/scanning-service/actions/workflows/zizmor-sast.yml)*"

              # Create a signed commit via the GitHub API.
              # Many GSA-TTS repos require signed commits in branch protection rules.
              "${GITHUB_WORKSPACE}/.github/actions/signed-commit/create-signed-commit.sh" \
                "$repo" "$BRANCH" "fix: apply zizmor safe auto-fixes for Actions security"

              gh pr create --repo "$repo" \
                --title "$PR_PREFIX" \
                --body "$PR_BODY" \
                --head "$BRANCH" \
                --base main

              # Refresh the current report with the newly created remediation PR.
              python3 "$GITHUB_WORKSPACE/.github/scripts/zizmor_issue.py" \
                "$WORKDIR/zizmor-findings.json" "$WORKDIR" "$repo" \
                "$(git rev-parse HEAD)" "$ZIZMOR_VERSION" "$SCAN_RUN_URL"

              echo "Created PR in ${repo}"
              FIXED=$((FIXED + 1))
            fi

            cd /
            rm -rf "$WORKDIR"
          done

          {
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Repos scanned | ${SCANNED} |"
            echo "| Clean repos | ${CLEAN} |"
            echo "| Repos with findings | ${FINDINGS} |"
            echo "| PRs opened (auto-fixed) | ${FIXED} |"
            echo "| Issues opened/updated | ${REPORTED} |"
          } >> "$GITHUB_WORKSPACE/sast-report.md"

          cat "$GITHUB_WORKSPACE/sast-report.md"

      - name: Upload SAST report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: zizmor-sast-report-${{ github.run_id }}
          path: ${{ github.workspace }}/sast-report.md
          retention-days: 90
