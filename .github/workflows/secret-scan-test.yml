name: Secret Scan Self-Test

on:
  pull_request:
    paths:
      - ".gitleaks.toml"
      - ".github/actions/secret-scan/**"
      - ".github/workflows/secret-scan.yml"
      - ".github/workflows/gitleaks-audit.yml"
      - ".github/workflows/secret-scan-test.yml"
      - "bin/test-gitleaks-config"
      - "bin/create-secret-scan-fixture"
  push:
    branches: [main]
    paths:
      - ".gitleaks.toml"
      - ".github/actions/secret-scan/**"
      - ".github/workflows/secret-scan.yml"
      - ".github/workflows/gitleaks-audit.yml"
      - ".github/workflows/secret-scan-test.yml"
      - "bin/test-gitleaks-config"
      - "bin/create-secret-scan-fixture"

permissions: {}

jobs:
  validate-config:
    name: Validate gitleaks config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.30.1"
          curl -sfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Validate config syntax
        run: |
          set -euo pipefail
          # gitleaks will exit non-zero if the config is invalid
          gitleaks detect --source=. --no-git --config=.gitleaks.toml --exit-code=0 > /dev/null 2>&1
          echo "Config is valid."

  test-composite-action:
    name: Test composite action (${{ matrix.fixture }} history)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture: [clean, finding]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: .test-toolkit

      - name: Create isolated fixture history
        env:
          FIXTURE_KIND: ${{ matrix.fixture }}
        run: bash .test-toolkit/bin/create-secret-scan-fixture "$GITHUB_WORKSPACE" "$FIXTURE_KIND"

      - name: Run secret scan action against fixture history
        id: scan
        continue-on-error: ${{ matrix.fixture == 'finding' }}
        uses: $/.github/actions/secret-scan
        with:
          fail-on-error: "true"
          scan-mode: full
          config-path: ".test-toolkit/.gitleaks.toml"

      - name: Assert composite action result
        if: ${{ !cancelled() }}
        env:
          FIXTURE_KIND: ${{ matrix.fixture }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          set -euo pipefail
          if [ "$FIXTURE_KIND" = clean ]; then
            test "$SCAN_OUTCOME" = success
            jq -e 'type == "array" and length == 0' /tmp/gitleaks-report.json
          else
            test "$SCAN_OUTCOME" = failure
            # An expected action failure alone could be an installer/tool error.
            # Require the specific planted finding, absent from the working tree.
            test ! -f planted.env
            jq -e 'any(.[]; .File == "planted.env" and .RuleID == "cloud-gov-cf-password")' \
              /tmp/gitleaks-report.json
          fi

  test-deliberate-finding:
    name: Test detection accuracy and false-positive regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.30.1"
          curl -sfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Run config tests
        run: bin/test-gitleaks-config .gitleaks.toml
