name: "Repository List"
description: "Load a cleaned repository list from repos.txt for workflow reuse"

inputs:
  repo-file:
    description: "Path to the repos.txt file"
    required: false
    default: ".github/repos.txt"

outputs:
  repos:
    description: "Space-delimited repository list"
    value: ${{ steps.load.outputs.repos }}
  filter:
    description: "JSON array of repositories"
    value: ${{ steps.load.outputs.filter }}
  token-repositories:
    description: "Validated comma-separated repository names for this owner's App token"
    value: ${{ steps.load.outputs.token-repositories }}

runs:
  using: "composite"
  steps:
    - name: Load repository list
      id: load
      shell: bash
      env:
        INSTALLATION_OWNER: ${{ github.repository_owner }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail

        FILTER=$(awk '
          {
            sub(/\r$/, "")
            gsub(/^[[:space:]]+|[[:space:]]+$/, "")
          }
          /^[[:space:]]*($|#)/ { next }
          { print }
        ' "${{ inputs.repo-file }}" | jq -Rsc 'split("\n") | map(select(length > 0))')
        REPOS=$(echo "$FILTER" | jq -r 'join(" ")')
        TOKEN_REPOSITORIES=$(echo "$FILTER" | bash "$ACTION_PATH/token-repositories.sh" "$INSTALLATION_OWNER")

        echo "repos=${REPOS}" >> "$GITHUB_OUTPUT"
        echo "filter=${FILTER}" >> "$GITHUB_OUTPUT"
        echo "token-repositories=${TOKEN_REPOSITORIES}" >> "$GITHUB_OUTPUT"
